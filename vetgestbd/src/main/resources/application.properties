spring.application.name=VetGestsBD

spring.datasource.url=jdbc:mysql://localhost:3306/VetGestBD
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP settings (mejor control y tiempos de conexión)
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.pool-name=HikariPool-1

# Evita que Hibernate bloquee esperando metadata JDBC (puede acelerar arranque)
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Evita mantenimientos automáticos en vista que pueden causar cargas adicionales
spring.jpa.open-in-view=false

# Si DevTools está presente, desactivar restart puede hacer el arranque más estable
spring.devtools.restart.enabled=false

# Inicialización perezosa de beans para reducir tiempo inicial (útil en dev)
spring.main.lazy-initialization=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

mailboxlayer.api.key=${MAILBOXLAYER_API_KEY}

# Configuración de correo - Brevo SMTP
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

spring.config.import=optional:classpath:secrets.properties
